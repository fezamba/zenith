<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Zenith</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .page-title {
            margin: 30px 0;
            color: var(--primary-color);
        }

        .profile-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            margin: 30px 0;
        }

        .profile-sidebar {
            background: var(--white);
            padding: 25px;
            border-radius: 8px;
            height: fit-content;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #f0f0f0;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .profile-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-email {
            color: var(--text-light);
        }

        .profile-points {
            background: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 10px;
        }

        .nav-menu a {
            display: block;
            padding: 12px 15px;
            text-decoration: none;
            color: var(--text-dark);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: var(--primary-color);
            color: white;
        }

        .profile-content {
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
        }

        .section-title {
            margin-bottom: 25px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-save {
            padding: 12px 30px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" placeholder="Procurar produtos...">
                    <button>Buscar</button>
                </div>
                
                <div class="user-actions">
                    <a href="produtos.html" class="btn btn-outline">Produtos</a>
                    <a href="carrinho.html" class="btn btn-outline">Carrinho</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1 class="page-title">Meu Perfil</h1>
            
            <div class="profile-container">
                <aside class="profile-sidebar">
                    <div class="profile-avatar">
                        👤
                    </div>
                    <div class="profile-info">
                        <div class="profile-name">João Silva</div>
                        <div class="profile-email">joao@email.com</div>
                    </div>
                    
                    <div class="profile-points">
                        <strong>250 Zenith Points</strong>
                    </div>

                    <ul class="nav-menu">
                        <li><a href="#" class="active">Dados Pessoais</a></li>
                        <li><a href="#">Meus Pedidos</a></li>
                        <li><a href="#">Endereços</a></li>
                        <li><a href="#">Alterar Senha</a></li>
                        <li><a href="#">Sair</a></li>
                    </ul>
                </aside>

                <section class="profile-content">
                    <h2 class="section-title">Dados Pessoais</h2>
                    
                    <form>
                        <div class="form-group">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" class="form-input" value="João Silva">
                        </div>

                        <div class="form-group">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-input" value="joao@email.com">
                        </div>

                        <div class="form-group">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-input" value="123.456.789-00">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Telefone</label>
                            <input type="tel" class="form-input" value="(21) 99999-9999">
                        </div>

                        <button type="submit" class="btn btn-primary btn-save">Salvar Alterações</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Zenith</h3>
                    <p>Marketplace sustentável e local</p>
                </div>
                <div class="footer-section">
                    <h4>Ajuda</h4>
                    <a href="#">Central de Ajuda</a>
                </div>
                <div class="footer-section">
                    <h4>Contato</h4>
                    <p>email@zenith.com</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
