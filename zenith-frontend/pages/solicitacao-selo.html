<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Selo - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro-produto.css"> </head>
<body>
    <header>
        <div class="container">
            <nav>
                <button id="btnVoltar" class="btn-icon-back" title="Voltar">⬅</button>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h2 class="page-title">Solicitar Selo de Sustentabilidade</h2>
            <p style="margin-bottom:20px; color:#666">Destaque o seu produto para clientes conscientes.</p>

            <form id="formSelo">
                <div class="form-group">
                    <label>Tipo de Selo</label>
                    <select id="tipoSelo" required>
                        <option value="SUSTENTAVEL">🌱 Produto Sustentável</option>
                        <option value="LOCAL">📍 Produção Local</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Justificativa</label>
                    <textarea id="justificativa" rows="5" placeholder="Explique por que este produto merece o selo..." required></textarea>
                    <small>O administrador analisará esta informação.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Enviar Solicitação</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { Api } from '../assets/js/api.js';
        import { $ } from '../assets/js/utils.js';

        const params = new URLSearchParams(window.location.search);
        const produtoId = params.get('produtoId');

        if(!produtoId) {
            alert("Produto inválido.");
            window.location.href = 'painel-vendedor.html';
        }

        $('#formSelo').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await Api.vendedor.solicitarSelo(produtoId, {
                    tipoSelo: $('#tipoSelo').value,
                    justificativa: $('#justificativa').value
                });
                alert("Solicitação enviada com sucesso!");
                window.location.href = 'painel-vendedor.html';
            } catch (err) {
                alert("Erro: " + err.message);
            }
        });
    </script>
    <script type="module" src="../assets/js/header.js"></script>
</body>
</html>
