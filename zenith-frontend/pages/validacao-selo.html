<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Validar Selo - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/validacao-selo.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <a href="painel-adm.html" class="btn btn-outline" style="margin: 20px 0; display:inline-block;">&larr; Voltar ao Painel</a>
        
        <div class="validation-card">
            <div class="header-validation">
                <h2 class="page-title">Análise de Selo</h2>
                <span class="status-tag">PENDENTE</span>
            </div>

            <div class="product-summary">
                <div class="img-placeholder">📦</div>
                <div>
                    <h3 id="prodNome">Carregando...</h3>
                    <p id="prodVendedor" style="color:var(--text-light)">Vendedor: ...</p>
                    <p id="prodPreco" class="price">...</p>
                </div>
            </div>

            <div class="justification-box">
                <h4>Justificativa do Vendedor</h4>
                <p id="prodJustificativa" class="justification-text">
                    ...
                </p>
            </div>

            <div class="actions-validation">
                <button id="btnRejeitar" class="btn btn-outline btn-danger">Rejeitar Solicitação</button>
                <button id="btnAprovar" class="btn btn-primary btn-success">Aprovar Selo</button>
            </div>
        </div>
    </main>

    <script type="module" src="../assets/js/validacao-selo.js"></script>
</body>
</html>
