<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Vendedor - Zenith</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/painel-vendedor.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <button id="btnVoltar" class="btn-icon-back" title="Voltar">⬅</button>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-header">
            <h2 class="page-title">Painel do Vendedor</h2>
            <a href="cadastro-produto.html" class="btn btn-primary">+ Novo Produto</a>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-target="meus-produtos">Meus Produtos</button>
            <button class="tab-btn" data-target="minhas-vendas">Vendas & Pedidos</button>
        </div>

        <section id="meus-produtos" class="tab-content active">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Status</th>
                            <th>Selo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        </tbody>
                </table>
                <p id="loadingProdutos" class="loading-text">Carregando produtos...</p>
                <p id="emptyProdutos" class="empty-text" style="display:none;">Você ainda não cadastrou nenhum produto.</p>
            </div>
        </section>

        <section id="minhas-vendas" class="tab-content">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Pedido #</th>
                            <th>Data</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="listaVendas">
                        </tbody>
                </table>
                <p id="loadingVendas" class="loading-text">Carregando vendas...</p>
                <p id="emptyVendas" class="empty-text" style="display:none;">Nenhuma venda realizada ainda.</p>
            </div>
        </section>

    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h3>Zenith</h3>
                <p>Área restrita para parceiros.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/painel-vendedor.js"></script>
    <script type="module" src="../assets/js/header.js"></script>
</body>
</html>
