<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .page-title {
            margin: 30px 0;
            color: var(--primary-color);
        }

        .form-container {
            max-width: 600px;
            margin: 30px auto;
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
        }

        .form-title {
            margin-bottom: 25px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .image-upload {
            border: 2px dashed var(--border-color);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin: 20px 0;
            cursor: pointer;
        }

        .image-upload:hover {
            border-color: var(--primary-color);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-full {
            flex: 1;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="user-actions">
                    <a href="painel-vendedor.html" class="btn btn-outline">Voltar ao Painel</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1 class="page-title">Cadastrar Novo Produto</h1>
            
            <div class="form-container">
                <h2 class="form-title">Informações do Produto</h2>
                
                <form>
                    <div class="form-group">
                        <label class="form-label">Nome do Produto *</label>
                        <input type="text" class="form-input" placeholder="Ex: Smartwatch Samsung Galaxy">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Descrição *</label>
                        <textarea class="form-textarea" placeholder="Descreva o produto..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Categoria *</label>
                        <select class="form-select">
                            <option value="">Selecione uma categoria</option>
                            <option value="eletronicos">Eletrônicos</option>
                            <option value="moda">Moda</option>
                            <option value="casa">Casa e Decoração</option>
                            <option value="livros">Livros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Preço *</label>
                        <input type="number" class="form-input" placeholder="R$ 0,00" step="0.01">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Quantidade em Estoque *</label>
                        <input type="number" class="form-input" placeholder="0">
                    </div>

                    <div class="image-upload">
                        <h3>📷 Adicionar Imagens</h3>
                        <p>Clique para fazer upload das fotos do produto</p>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Solicitar Selo</label>
                        <div class="form-checkbox">
                            <input type="checkbox" id="selo-sustentavel">
                            <label for="selo-sustentavel">Selo Sustentável</label>
                        </div>
                        <div class="form-checkbox">
                            <input type="checkbox" id="selo-local">
                            <label for="selo-local">Selo Local</label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-outline btn-full">Cancelar</button>
                        <button type="submit" class="btn btn-primary btn-full">Cadastrar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Zenith</h3>
                    <p>Marketplace sustentável e local</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
