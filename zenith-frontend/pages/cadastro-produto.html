<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Produto - Zenith</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro-produto.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <button id="btnVoltar" class="btn-icon-back" title="Voltar">⬅</button>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <div class="form-header">
                <h2 class="page-title">Cadastrar Novo Produto</h2>
                <a href="painel-vendedor.html" class="btn btn-outline">Voltar</a>
            </div>

            <form id="formProduto">
                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" required placeholder="Ex: Smartphone Galaxy...">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="">Carregando categorias...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="estoque">Estoque Inicial</label>
                        <input type="number" id="estoque" required min="1" value="1">
                    </div>
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" required min="0.01" step="0.01" placeholder="0,00">
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição Detalhada</label>
                    <textarea id="descricao" rows="5" placeholder="Descreva as características do produto..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg" id="btnSalvar">Publicar Produto</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h3>Zenith</h3>
                <p>Área do Vendedor.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/cadastro-produto.js"></script>
    <script type="module" src="../assets/js/header.js"></script>
</body>
</html>
