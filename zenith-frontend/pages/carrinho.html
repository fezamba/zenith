<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - Zenith</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/carrinho.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">Seu Carrinho de Compras</h2>

        <div id="loading" style="text-align: center; padding: 50px; color: var(--text-light);">
            <p>A carregar os seus produtos...</p>
        </div>

        <div id="emptyState" class="empty-cart" style="display: none;">
            <h3>O seu carrinho está vazio</h3>
            <p>Parece que ainda não adicionou nada.</p>
            <a href="home.html" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">Começar a Comprar</a>
        </div>

        <div id="cartContent" class="cart-container" style="display: none;">
            
            <div class="cart-items" id="listaItens">
                </div>

            <div class="cart-summary">
                <h3>Resumo do Pedido</h3>
                
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotalValue">R$ 0,00</span>
                </div>
                
                <div class="summary-row">
                    <span>Frete</span>
                    <span style="color: #27ae60;">Grátis</span>
                </div>

                <div class="summary-total">
                    <div class="summary-row" style="border:none; margin:0; padding:0;">
                        <span>Total</span>
                        <span id="totalValue">R$ 0,00</span>
                    </div>
                </div>

                <button id="btnCheckout" class="btn btn-primary btn-full">
                    Finalizar Compra
                </button>
                
                <a href="home.html" class="btn btn-outline btn-full" style="margin-top: 10px; text-align: center; display: block;">
                    Continuar a Comprar
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h3>Zenith</h3>
                <p>Consumo consciente.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/carrinho.js"></script>
</body>
</html>
