<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Zenith</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/produto-detalhe.css">
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <button id="btnVoltar" class="btn-icon-back" title="Voltar">⬅</button>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container">
        
        <div style="margin: 20px 0; color: var(--text-light); font-size: 0.9rem;">
            <a href="home.html" style="color: inherit; text-decoration: none;">Home</a> &gt; 
            <span id="breadcrumbCategoria">Categoria</span> &gt; 
            <span id="breadcrumbNome">Produto</span>
        </div>

        <div class="product-detail-container">
            
            <div class="product-gallery">
                <div class="main-image">
                    <span>📦</span>
                </div>
            </div>

            <div class="product-info-section">
                <div id="seloContainer" style="margin-bottom: 10px;"></div>
                
                <h1 id="produtoNome" class="product-title-large">Carregando...</h1>
                
                <div class="seller-ref">
                    Vendido por: <span id="produtoVendedor">-</span>
                </div>

                <div class="price-section">
                    <span id="produtoPreco" class="big-price">R$ --,--</span>
                    <p style="font-size: 0.9rem; color: #666; margin-top: 5px;">
                        À vista no PIX ou em até 12x no cartão
                    </p>
                </div>

                <div class="actions-section">
                    <div class="quantity-selector">
                        <button id="btnQtdMenos">-</button>
                        <input type="number" id="inputQtd" value="1" min="1" readonly>
                        <button id="btnQtdMais">+</button>
                    </div>
                    <button id="btnAdicionarCarrinho" class="btn btn-primary btn-lg">
                        Adicionar ao Carrinho
                    </button>
                </div>

                <div class="description-box">
                    <h3>Descrição</h3>
                    <p id="produtoDescricao">...</p>
                </div>
            </div>
        </div>

        <section class="reviews-section">
            <h3>Avaliações dos Clientes</h3>
            
            <div id="listaAvaliacoes" class="reviews-list">
                <p>Carregando avaliações...</p>
            </div>

            <div id="formAvaliacaoContainer" class="review-form-box" style="display: none;">
                <h4>Avaliar este produto</h4>
                <form id="formAvaliacao">
                    <div class="rating-select">
                        <label>Nota:</label>
                        <select id="notaAvaliacao">
                            <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                            <option value="4">⭐⭐⭐⭐ (4)</option>
                            <option value="3">⭐⭐⭐ (3)</option>
                            <option value="2">⭐⭐ (2)</option>
                            <option value="1">⭐ (1)</option>
                        </select>
                    </div>
                    <textarea id="textoAvaliacao" placeholder="Conte-nos o que achou do produto..." required></textarea>
                    <button type="submit" class="btn btn-primary">Enviar Avaliação</button>
                </form>
            </div>
            <div id="avisoLoginAvaliacao" style="margin-top: 20px; color: #666;">
                <a href="tela_login.html" style="color: var(--primary-color);">Faça login</a> para avaliar este produto.
            </div>
        </section>

    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h3>Zenith</h3>
                <p>Consumo consciente.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/produto-detalhe.js"></script>
    <script type="module" src="../assets/js/header.js"></script>
</body>
</html>
