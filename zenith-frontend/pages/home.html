<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith - Home</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/home.css">

</body>
</html>

</head>
<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" placeholder="Procurar produtos...">
                    <button>Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    <a href="" class="btn btn-outline">aaa</a>
                    <a href="" class="btn btn-outline">bbb</a>
                </div>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>Sustentabilidade em cada compra</h2>
            <p>O marketplace que conecta você a vendedores locais e conscientes.</p>
        </div>
    </section>

    <main class="container">
        
        <section style="margin-bottom: 50px;">
            <h3 style="margin-bottom: 20px; color: var(--text-dark);">Categorias</h3>
            <div class="categories" id="listaCategorias">
                <p style="color: var(--text-light);">Carregando categorias...</p>
            </div>
        </section>

        <section class="products-section">
            <div class="section-header">
                <h2 class="section-title" id="tituloProdutos">Destaques</h2>
            </div>
            
            <div class="products-grid" id="listaProdutos">
                <p style="color: var(--text-light);">Carregando produtos...</p>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Zenith</h3>
                    <p>Consumo consciente.</p>
                </div>
                <div class="footer-section">
                    <h4>Ajuda</h4>
                    <a href="#">Central de Ajuda</a>
                </div>
                <div class="footer-section">
                    <h4>Contato</h4>
                    <p>email@zenith.com</p>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/home.js"></script>
        <script type="module" src="../assets/js/header.js"></script>

</body>
</html>
