<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/produtos.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <button id="btnVoltar" class="btn-icon-back" title="Voltar">⬅</button>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container catalog-layout">
        <aside class="filters-sidebar">
            <div class="filter-group">
                <h3>Categorias</h3>
                <div id="listaCategorias" class="filter-options">
                    <p>Carregando...</p>
                </div>
            </div>

            <div class="filter-group">
                <h3>Preço</h3>
                <div class="price-inputs">
                    <input type="number" id="precoMin" placeholder="Mín">
                    <span style="align-self:center">-</span>
                    <input type="number" id="precoMax" placeholder="Máx">
                </div>
            </div>

            <div class="filter-group">
                    <h3>Selo de Qualidade</h3>
                    <select id="filtroSelo" class="filter-input">
                        <option value="">Todos os produtos</option>
                        <option value="SUSTENTAVEL">🌱 Sustentável</option>
                        <option value="LOCAL">📍 Produção Local</option>
                    </select>
            </div>  

            <button id="btnFiltrar" class="btn btn-primary" style="width:100%">Aplicar Filtros</button>
            <button id="btnLimpar" class="btn btn-outline" style="width:100%; margin-top:10px">Limpar</button>
        </aside>

        <section class="catalog-content">
            <div class="catalog-header">
                <h2 id="tituloCatalogo">Todos os Produtos</h2>
                <span id="contadorProdutos" style="color:var(--text-light)">...</span>
            </div>
            <div id="gridProdutos" class="products-grid">
                <p>Carregando...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-section">
                <h3>Zenith</h3>
                <p>Consumo consciente.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/produtos.js"></script>
    <script type="module" src="../assets/js/header.js"></script>
</body>
</html>
