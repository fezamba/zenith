<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/painel-adm.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <button id="btnVoltar" class="btn-icon-back" title="Voltar">⬅</button>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title">Administração do Sistema</h2>
        
        <div class="tabs">
            <button class="tab-btn active" data-target="vendedores">Vendedores Pendentes</button>
            <button class="tab-btn" data-target="selos">Solicitações de Selo</button>
            <button class="tab-btn" data-target="categorias">Gerenciar Categorias</button>
        </div>

        <section id="vendedores" class="tab-content active">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome / Empresa</th>
                            <th>CNPJ</th>
                            <th>Email</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaVendedores"></tbody>
                </table>
                <p id="msgVendedores" class="empty-msg">Nenhum vendedor pendente.</p>
            </div>
        </section>

<section id="selos" class="tab-content">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Vendedor</th>
                            <th>Tipo</th> <th>Justificativa</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaSelos"></tbody>
                </table>
                <p id="msgSelos" class="empty-msg">Nenhuma solicitação de selo.</p>
            </div>
        </section>

        <section id="categorias" class="tab-content">
            <div class="category-form">
                <input type="text" id="novaCategoriaNome" placeholder="Nome da nova categoria">
                <button id="btnCriarCategoria" class="btn btn-primary">Adicionar</button>
            </div>
            <div class="category-list" id="listaCategorias">
                </div>
        </section>
    </main>

    <script type="module" src="../assets/js/painel-adm.js"></script>
    <script type="module" src="../assets/js/header.js"></script>
</body>
</html>
