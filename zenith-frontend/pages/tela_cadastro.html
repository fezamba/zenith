<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tela-cadastro.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container login-container">
        <div class="login-card" style="max-width: 500px;">
            <h2>Crie sua conta</h2>
            
            <div class="tabs">
                <button class="tab-btn active" data-type="cliente">Sou Cliente</button>
                <button class="tab-btn" data-type="vendedor">Sou Vendedor</button>
            </div>

            <form id="formCadastro">
                <input type="hidden" id="tipoUsuario" value="cliente">

                <div class="form-group">
                    <label for="nome">Nome Completo / Razão Social</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group" id="group-cpf">
                    <label for="doc">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>

                <div class="form-group" id="group-cnpj" style="display:none;">
                    <label for="doc">CNPJ</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirmaSenha">Confirmar Senha</label>
                    <input type="password" id="confirmaSenha" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btnCadastrar">Cadastrar</button>
            </form>
            
            <div class="login-footer">
                <p>Já tem conta? <a href="tela_login.html">Faça Login</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="../assets/js/cadastro.js"></script>
</body>
</html>
