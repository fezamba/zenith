<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tela-cadastro.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="user-actions">
                    <a href="tela_login.html" class="btn btn-outline">Já tenho conta</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="form-container">
                <h2 class="form-title">Criar conta</h2>
                
                <form>
                    <div class="form-group">
                        <label class="form-label">Nome completo</label>
                        <input type="text" class="form-input" placeholder="Seu nome completo">
                    </div>

                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-input" placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label">CPF/CNPJ</label>
                        <input type="text" class="form-input" placeholder="000.000.000-00">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tipo de conta</label>
                        <div class="form-radio-group">
                            <label class="form-radio">
                                <input type="radio" name="account-type" value="cliente" checked>
                                Cliente
                            </label>
                            <label class="form-radio">
                                <input type="radio" name="account-type" value="vendedor">
                                Vendedor
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-input" placeholder="Mínimo 6 caracteres">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirmar senha</label>
                        <input type="password" class="form-input" placeholder="Digite a senha novamente">
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
                </form>

                <div class="login-link">
                    <p>Já tem uma conta? <a href="tela_login.html">Fazer login</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Zenith</h3>
                    <p>Marketplace sustentável e local</p>
                </div>
                <div class="footer-section">
                    <h4>Ajuda</h4>
                    <a href="#">Central de Ajuda</a>
                    <a href="#">Política de Trocas</a>
                </div>
                <div class="footer-section">
                    <h4>Contato</h4>
                    <p>zenith@gmail.com</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
