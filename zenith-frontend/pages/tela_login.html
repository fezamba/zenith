<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tela_login.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <!-- <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div> -->
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container login-container">
        <div class="login-card">
            <h2>Bem-vindo de volta</h2>
            <p class="subtitle">Entre para gerenciar suas compras ou vendas</p>
            
            <form id="formLogin">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="********">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="btnEntrar">Entrar</button>
            </form>
            
            <div class="login-footer">
                <p>Não tem uma conta? <a href="tela_cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
