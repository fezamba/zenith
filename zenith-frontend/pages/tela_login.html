<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/tela_login.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="user-actions">
                    <a href="tela_cadastro.html" class="btn btn-outline">Criar conta</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="form-container">
                <h2 class="form-title">Fazer login</h2>
                
                <form>
                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-input" placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-input" placeholder="Sua senha">
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                </form>

                <div class="links">
                    <a href="#">Esqueci minha senha</a>
                    <a href="tela_cadastro.html">Não tenho conta - Cadastrar</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Zenith</h3>
                    <p>Marketplace sustentável e local</p>
                </div>
                <div class="footer-section">
                    <h4>Ajuda</h4>
                    <a href="#">Central de Ajuda</a>
                </div>
                <div class="footer-section">
                    <h4>Contato</h4>
                    <p>email@zenith.com</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
