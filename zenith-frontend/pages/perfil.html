<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Conta - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script type="module" src="../assets/js/header.js"></script>
    <header>
        <div class="container">
            <nav>
                <div style="display:flex; align-items:center; gap:15px">
                    <button id="btnVoltar" class="btn-icon-back" title="Voltar">⬅</button>
                    <div class="logo">
                        <a href="home.html" style="text-decoration: none; color: inherit;">
                            <h1>Zenith</h1>
                        </a>
                    </div>
                </div>
                
                <div class="user-actions" id="menuUsuario"></div>
            </nav>
        </div>
    </header>

    <main class="container profile-container">
        <aside class="profile-sidebar">
            <div class="profile-avatar">
                <i class="fas fa-user"></i>
            </div>
            
            <div class="profile-info">
                <h2 id="userName" class="profile-name">Carregando...</h2>
                <p id="userEmail" class="profile-email">...</p>
            </div>

            <div class="profile-points">
                <div style="font-size: 0.9rem; opacity: 0.9;">MEUS PONTOS</div>
                <div style="font-size: 2.2rem; font-weight: bold; margin: 5px 0;">
                    💎 <span id="userPoints">0</span>
                </div>
                <small>Use no checkout para descontos!</small>
            </div>

            <ul class="nav-menu">
                <li>
                    <a href="#" class="active">
                        <i class="fas fa-box-open" style="margin-right:10px"></i> Meus Pedidos
                    </a>
                </li>
                <li>
                    <a href="#" id="btnAbrirModalEndereco">
                        <i class="fas fa-map-marker-alt" style="margin-right:10px"></i> Novo Endereço
                    </a>
                </li>
                <li>
                    <a href="#" id="btnTrocarSenha">
                        <i class="fas fa-lock" style="margin-right:10px"></i> Trocar Senha
                    </a>
                </li>
                <li style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">
                    <a href="#" id="btnSairSidebar" style="color: #d32f2f;">
                        <i class="fas fa-sign-out-alt" style="margin-right:10px"></i> Sair
                    </a>
                </li>
            </ul>
        </aside>

        <section class="profile-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
                <h2 class="section-title" style="margin-bottom:0; border:none;">📦 Histórico de Pedidos</h2>
                <button onclick="carregarPedidos()" class="btn btn-sm btn-outline" title="Atualizar"><i class="fas fa-sync-alt"></i></button>
            </div>

            <div id="listaPedidos">
                <div style="text-align:center; padding: 40px; color:#888;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top:10px">Buscando seus pedidos...</p>
                </div>
            </div>
        </section>
        <div id="modalCadastroEndereco" class="modal-overlay" style="display:none;">
            <div class="modal-content" style="text-align: left; max-width: 400px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h3>Novo Endereço</h3>
                    <span id="btnFecharModal" style="cursor:pointer; font-size:1.5rem;">&times;</span>
                </div>

                <form id="formModalEndereco">
                    <div class="form-group">
                        <label>CEP</label>
                        <input type="text" id="modal-cep" placeholder="00000-000" required style="width:100%; padding:8px; margin-bottom:10px;">
                    </div>
                    <div class="form-group">
                        <label>Logradouro</label>
                        <input type="text" id="modal-logradouro" placeholder="Rua..." required style="width:100%; padding:8px; margin-bottom:10px;">
                    </div>
                    <div style="display:flex; gap:10px;">
                        <div class="form-group" style="flex:1;">
                            <label>Número</label>
                            <input type="text" id="modal-numero" required style="width:100%; padding:8px; margin-bottom:10px;">
                        </div>
                        <div class="form-group" style="flex:2;">
                            <label>Cidade</label>
                            <input type="text" id="modal-cidade" required style="width:100%; padding:8px; margin-bottom:10px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Estado (UF)</label>
                        <input type="text" id="modal-estado" placeholder="RJ" maxlength="2" required style="width:100%; padding:8px; margin-bottom:10px; text-transform:uppercase;">
                    </div>
                    <div style="text-align:right; margin-top:15px;">
                        <button type="submit" class="btn btn-primary">Salvar Endereço</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <script type="module">
        import { Auth } from '../assets/js/auth.js';
        import { Api } from '../assets/js/api.js';
        import { $, formatarMoeda, formatarData } from '../assets/js/utils.js';
        import { setupModalEndereco } from '../assets/js/modal-endereco.js';

        if (!Auth.isLogado()) window.location.href = 'tela_login.html';

        const user = Auth.getDadosUsuario();
        $('#userName').innerText = user.sub;
        $('#userEmail').innerText = user.email || user.sub; 
        
        $('#btnSairSidebar').addEventListener('click', (e) => {
            e.preventDefault();
            Auth.logout();
        });

        window.carregarPedidos = async function() {
            const container = $('#listaPedidos');
            container.innerHTML = '<div style="text-align:center; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>';

            try {
                const pedidos = await Api.pedidos.meusPedidos(); 
                
                if(!pedidos || pedidos.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center; padding: 40px; color:#777; border: 2px dashed #eee; border-radius:10px;">
                            <i class="fas fa-shopping-basket" style="font-size:3rem; margin-bottom:15px; color:#ddd;"></i>
                            <p>Você ainda não fez nenhum pedido.</p>
                            <a href="home.html" class="btn btn-primary" style="margin-top:15px">Ir às Compras</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = pedidos.map(p => {
                    let statusColor = '#666';
                    let statusBg = '#eee';
                    if(p.status === 'ENTREGUE') { statusColor = '#2e7d32'; statusBg = '#e8f5e9'; }
                    else if(p.status === 'PENDENTE') { statusColor = '#f57c00'; statusBg = '#fff3e0'; }
                    else if(p.status === 'ENVIADO') { statusColor = '#1976d2'; statusBg = '#e3f2fd'; }

                    const itensHtml = p.itens.map(i => {
                        const btnAvaliar = p.status === 'ENTREGUE' 
                            ? `<a href="produto-detalhe.html?id=${i.produtoId}" class="btn-avaliar-item" title="Avaliar este produto">
                                 ⭐ Avaliar
                               </a>` 
                            : '';
                        
                        return `
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; padding-bottom:5px; border-bottom:1px dashed #f0f0f0;">
                                <span>${i.quantidade}x <strong>${i.nomeProduto}</strong></span>
                                ${btnAvaliar}
                            </div>
                        `;
                    }).join('');

                    return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <span class="order-id">Pedido #${p.id}</span>
                                <span class="order-date">${formatarData(p.data)}</span>
                            </div>
                            <span class="order-status" style="color:${statusColor}; background:${statusBg}">
                                ${p.status}
                            </span>
                        </div>
                        
                        <div class="order-body">
                            <div class="order-items-list" style="margin-bottom:10px;">
                                ${itensHtml}
                            </div>
                            <p class="order-total" style="text-align:right; border-top:1px solid #eee; padding-top:10px;">
                                Total: ${formatarMoeda(p.valorTotal)}
                            </p>
                        </div>
                        
                        <div class="order-footer">
                            <button class="btn btn-sm btn-outline" onclick="alert('Nota fiscal e rastreio em breve!')">Detalhes</button>
                            </div>
                    </div>
                    `;
                }).join('');

            } catch(e) {
                console.error(e);
                container.innerHTML = `
                    <div style="color:#d32f2f; text-align:center;">
                        <p>Erro ao carregar seus pedidos.</p>
                        <small>${e.message}</small>
                    </div>
                `;
            }
        };

        async function carregarDadosUsuario() {
            try {
                const dados = await Api.cliente.me();
                
                $('#userName').innerText = dados.nome;
                $('#userEmail').innerText = dados.email;
                $('#userPoints').innerText = dados.zenithPoints;
                
            } catch (e) {
                console.error("Erro ao carregar perfil:", e);
            }
        }

        setupModalEndereco(() => {
            console.log("Endereço salvo via Perfil");
        });
        carregarDadosUsuario();
        carregarPedidos();
        
    </script>
    <!-- FIXME: colocar funcionalidade de troca de senha no backend -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const btnTrocarSenha = document.getElementById('btnTrocarSenha');
        
        if(btnTrocarSenha) {
            btnTrocarSenha.addEventListener('click', (e) => {
                e.preventDefault();
                alert("Funcionalidade em desenvolvimento: O backend para troca de senha será implementado futuramente.");
            });
        }
    });
</script>
</body>
</html>
