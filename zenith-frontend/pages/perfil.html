<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Conta - Zenith</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/perfil.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="home.html" style="text-decoration: none; color: inherit;">
                        <h1>Zenith</h1>
                    </a>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Procurar produtos...">
                    <button id="btnBuscar">Buscar</button>
                </div>
                
                <div class="user-actions" id="menuUsuario">
                    </div>
            </nav>
        </div>
    </header>

    <main class="container profile-container">
        <div class="profile-header">
            <div class="avatar">👤</div>
            <div>
                <h2 id="userName">Carregando...</h2>
                <p id="userEmail">...</p>
            </div>
            <div class="points-card">
                <span style="font-size:2rem">💎</span>
                <div>
                    <h3>Zenith Points</h3>
                    <p id="userPoints" style="font-size:1.5rem; font-weight:bold; color:var(--primary-color)">0</p>
                </div>
            </div>
        </div>

        <div class="orders-section">
            <h3>Meus Pedidos Recentes</h3>
            <p style="color:#777">Funcionalidade de histórico em desenvolvimento.</p>
        </div>
    </main>

    <script type="module">
        import { Auth } from '../assets/js/auth.js';
        import { $ } from '../assets/js/utils.js';

        if (!Auth.isLogado()) window.location.href = 'tela_login.html';

        const user = Auth.getDadosUsuario();
        $('#userName').innerText = user.sub;
        $('#userEmail').innerText = user.sub; 
        
        $('#btnSair').addEventListener('click', Auth.logout);
    </script>
</body>
</html>
